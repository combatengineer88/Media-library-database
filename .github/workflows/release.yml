name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Validate source
        run: python -m py_compile media_library.py updater.py
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --name MediaLibraryDatabase media_library.py
      - name: Package updater asset
        shell: pwsh
        run: Compress-Archive -Path dist/MediaLibraryDatabase/* -DestinationPath Media-Library-Database-update.zip -Force
      - name: Publish v2.4.3
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.3
          files: Media-Library-Database-update.zip
          generate_release_notes: true
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Media-Library-Database-update.zip
          generate_release_notes: true
